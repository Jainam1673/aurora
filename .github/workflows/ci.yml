name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality-and-tests:
    name: Python 3.14 (Lint, Typecheck, Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Install Ninja & CMake Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtest-dev

      - name: Build C++ Parity Runner for Python Parity Tests
        run: |
          cmake --preset debug
          cmake --build --preset debug --target aurora_parity_runner

      - name: Run Ruff Lint
        run: uv run ruff check python tests

      - name: Run Ruff Format Check
        run: uv run ruff format --check python tests

      - name: Run Mypy Typecheck
        run: uv run mypy python tests/python tests/parity

      - name: Run Pytest Test Suite
        run: uv run pytest -v

  cpp23-gcc-build-and-test:
    name: C++23 GCC (Build & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ninja & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtest-dev

      - name: Configure CMake (GCC Debug)
        run: cmake --preset debug

      - name: Build C++ Targets
        run: cmake --build --preset debug

      - name: Run C++ Smoke Tests
        run: ctest --preset debug

      - name: Run AURORA Native CLI
        run: ./build/debug/aurora_cli

  cpp23-clang-build-and-test:
    name: C++23 Clang (Build & Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ninja & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libgtest-dev

      - name: Configure CMake (Clang Debug)
        run: cmake --preset clang-debug

      - name: Build C++ Targets
        run: cmake --build --preset clang-debug

      - name: Run C++ Smoke Tests
        run: ctest --preset clang-debug
